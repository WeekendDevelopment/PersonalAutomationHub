# newshub modes. Edit this file, then restart:  docker compose restart worker bot api
#
# A mode is one stream of news with its own interests, sources and schedule.
# The mode's key (tech, gaming, f1) is also its Telegram command: /tech
#
# Per mode:
#   emoji, title    how it looks in Telegram
#   interests       keyword: weight. Whole-word, case-insensitive match.
#                   A hit in the title counts double. Higher weight = more important.
#   block           an item containing any of these words is dropped
#   sources         where to look. type is the adapter in src/newshub/sources/
#                   (rss, hackernews). boost is added to every item from that source.
#   digest_times    local times (see timezone) for the scheduled digest. Quote them.
#   digest_size     how many items per digest
#   alert_score     optional: items scoring at least this, published in the last
#                   6 hours, are pushed immediately instead of waiting for a digest
#   max_age_hours   optional (default 48): ignore anything older

timezone: Europe/London
collect_every_minutes: 30

modes:
  tech:
    emoji: "💻"
    title: Technology
    digest_times: ["08:00", "18:00"]
    digest_size: 10
    alert_score: 18
    interests:
      # platform & infrastructure
      kubernetes: 4
      k8s: 4
      terraform: 4
      opentofu: 3
      platform engineering: 4
      observability: 4
      opentelemetry: 4
      prometheus: 3
      grafana: 3
      helm: 2
      argo cd: 3
      gitops: 3
      docker: 2
      devops: 2
      sre: 2
      # integration & event-driven architecture
      event-driven: 4
      kafka: 3
      nats: 3
      microservices: 2
      api gateway: 2
      # AI
      ai agents: 4
      ai agent: 4
      agentic: 4
      mcp: 3
      llm: 3
      llms: 3
      claude: 3
      openai: 2
      anthropic: 2
      ai: 1
      # general tech & science
      rust: 2
      python: 1
      open source: 2
      security: 1
      linux: 1
      space: 1
      nasa: 1
      physics: 1
    block:
      - sponsored
      - webinar
      - black friday
      - coupon
    sources:
      - name: Hacker News
        type: hackernews
        options: { min_points: 100 }
      - name: Kubernetes Blog
        url: https://kubernetes.io/feed.xml
        boost: 2
      - name: HashiCorp Blog
        url: https://www.hashicorp.com/blog/feed.xml
        boost: 1
      - name: Grafana Blog
        url: https://grafana.com/blog/index.xml
        boost: 1
      - name: OpenTelemetry Blog
        url: https://opentelemetry.io/blog/index.xml
        boost: 1
      - name: Platform Engineering
        url: https://platformengineering.org/blog/rss.xml
        boost: 1
      - name: Confluent Blog
        url: https://www.confluent.io/rss.xml
      - name: The New Stack
        url: https://thenewstack.io/feed/
      - name: InfoQ
        url: https://feed.infoq.com/
      - name: Simon Willison
        url: https://simonwillison.net/atom/everything/
      - name: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
      - name: The Verge
