name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t newshub:ci .
      - name: Image starts and the code imports
        run: docker run --rm newshub:ci python -c "import newshub.api, newshub.bot, newshub.worker"
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
