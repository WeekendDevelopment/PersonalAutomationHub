[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newshub"
version = "0.1.0"
description = "Personal automation hub: collects news on your interests and delivers it over Telegram."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "arq>=0.26",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
